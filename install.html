<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="信伯礼控">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>信伯礼控安装检测</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7fb;color:#171925;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    main{width:min(460px,calc(100% - 32px));padding:26px 22px;border:1px solid #e8e2ea;border-radius:24px;background:#fff;box-shadow:0 18px 55px rgba(61,45,70,.12)}
    .logo{width:62px;height:62px;border-radius:19px;background:linear-gradient(135deg,#ed79bf,#776cf2);margin:0 auto 16px}
    h1{text-align:center;font-size:22px;margin:0 0 8px}p{color:#686775;line-height:1.6;margin:0 0 16px;text-align:center}
    .line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #eee}.state{font-weight:800}.wait{color:#9a7629}.ok{color:#17844c}.bad{color:#c44343}
    #guide{display:none;margin-top:16px;padding:14px;border-radius:15px;background:#eef9f2;color:#14623a;line-height:1.65;font-weight:700}
    button{width:100%;min-height:48px;margin-top:14px;border:0;border-radius:14px;background:#6d60e8;color:#fff;font-size:16px;font-weight:800}
  </style>
</head>
<body>
<main>
  <div class="logo"></div>
  <h1>安装前自动检测</h1>
  <p>全部显示“完成”后再添加到主屏幕。</p>
  <div class="line"><span>网页程序接管</span><span class="state wait" id="worker">检测中</span></div>
  <div class="line"><span>核心页面缓存</span><span class="state wait" id="page">检测中</span></div>
  <div class="line"><span>样式与手机功能</span><span class="state wait" id="assets">检测中</span></div>
  <div id="guide">✅ 离线程序已经安装完成。现在点击 Safari 的“分享”按钮，选择“添加到主屏幕”。请添加当前这个安装检测页。</div>
  <button id="retry" type="button">重新检测</button>
</main>
<script>
const $=id=>document.getElementById(id);
const mark=(id,ok,text)=>{const el=$(id);el.textContent=text;el.className='state '+(ok?'ok':'bad')};
async function run(){
  $('guide').style.display='none';
  try{
    if(!('serviceWorker'in navigator))throw new Error('此浏览器不支持网页程序');
    await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller){
      if(sessionStorage.getItem('xinbo_install_reloaded_v23')!=='1'){
        sessionStorage.setItem('xinbo_install_reloaded_v23','1');
        location.reload();return;
      }
      throw new Error('网页程序尚未接管，请关闭本页后重新打开');
    }
    mark('worker',true,'完成');
    const cache=await caches.open('xinbo-manual-bootstrap-v1');
    const files=['./index.html','./install.html','./mobile-full.css','./mobile-adapter.js','./manifest.webmanifest','./icon-512.png'];
    for(const file of files){
      const response=await fetch(file+'?install='+Date.now(),{cache:'no-store'});
      if(!response.ok)throw new Error('下载失败：'+file);
      await cache.put(file,response.clone());
    }
    mark('page',true,'完成');
    const checks=await Promise.all(['./mobile-full.css','./mobile-adapter.js'].map(x=>caches.match(x)));
    if(checks.some(x=>!x))throw new Error('核心资源缓存不完整');
    mark('assets',true,'完成');
    $('guide').style.display='block';
  }catch(e){
    if($('worker').textContent!=='完成')mark('worker',false,'未完成');
    if($('page').textContent!=='完成')mark('page',false,'未完成');
    if($('assets').textContent!=='完成')mark('assets',false,'未完成');
    $('guide').style.display='block';
    $('guide').style.background='#fff0f0';$('guide').style.color='#9f3434';
    $('guide').textContent='检测没有完成：'+(e.message||e)+'。请保持 Safari 能正常打开网页后点“重新检测”。';
  }
}
$('retry').onclick=()=>location.reload();
if(matchMedia('(display-mode:standalone)').matches||navigator.standalone===true){
  location.replace('./index.html#schedule');
}else run();
</script>
</body>
</html>
