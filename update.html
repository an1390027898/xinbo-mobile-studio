<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>信伯礼控更新</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7fb;color:#171925;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    main{width:min(440px,calc(100% - 32px));padding:28px 22px;border:1px solid #e7e2e8;border-radius:24px;background:#fff;box-shadow:0 18px 55px rgba(61,45,70,.12);text-align:center}
    .dot{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,#ed79bf,#7d70f4)}
    h1{font-size:22px;margin:0 0 10px}p{color:#686775;line-height:1.65;margin:0}
    #state{margin-top:16px;font-weight:800;color:#6958da}
    button,a.next{display:none;width:100%;min-height:48px;margin-top:18px;border:0;border-radius:14px;background:#6f61e8;color:#fff;font-size:16px;font-weight:800;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
  </style>
</head>
<body>
  <main>
    <div class="dot"></div>
    <h1>正在强制更新</h1>
    <p>正在移除旧网页程序缓存。档期、客户、婚礼管家和本机歌曲数据不会被清除。</p>
    <div id="state">正在处理，请稍候…</div>
    <a class="next" id="next" href="./index.html?fresh=v18#schedule">第二步：打开最新版</a>
    <button id="retry" type="button">重新尝试</button>
  </main>
  <script>
    (async()=>{
      const state=document.getElementById('state'),retry=document.getElementById('retry'),next=document.getElementById('next');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg=>reg.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
        state.innerHTML='旧缓存已经清除。<br><br>请先关闭 Safari 里所有本网站标签页，并从后台彻底关闭 Safari；重新打开 Safari 后，再回到本页点击下面按钮。';
        next.href='./index.html?fresh=v18-'+Date.now()+'#schedule';
        next.style.display='flex';
      }catch(e){
        state.textContent='自动更新未完成，请点下面按钮重试';
        retry.style.display='block';
        retry.onclick=()=>location.reload();
      }
    })();
  </script>
</body>
</html>
