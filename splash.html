<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎使用</title>
  <style>
    :root{
      --bg1:#08111d;
      --bg2:#13233a;
      --bg3:#1b2e48;
      --card:rgba(18,29,47,.72);
      --card2:rgba(14,23,38,.82);
      --line:rgba(186,206,240,.16);
      --text:#eef4ff;
      --muted:#aebfdd;
      --soft:#d7e5ff;
      --accent:#7cc4ff;
      --accent2:#8c9dff;
      --warm:#ffd8b0;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:"PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;color:var(--text)}
    body{
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(146,197,255,.18), transparent 24%),
        radial-gradient(circle at 82% 24%, rgba(255,216,176,.14), transparent 22%),
        radial-gradient(circle at 70% 78%, rgba(140,157,255,.14), transparent 20%),
        linear-gradient(145deg, var(--bg3) 0%, var(--bg2) 34%, var(--bg1) 100%);
      display:flex;align-items:center;justify-content:center;padding:28px;
    }
    body::before,
    body::after{
      content:"";position:absolute;inset:auto;pointer-events:none;filter:blur(20px);opacity:.75;
      border-radius:999px;
    }
    body::before{width:280px;height:280px;left:-60px;top:-60px;background:rgba(124,196,255,.12)}
    body::after{width:320px;height:320px;right:-80px;bottom:-90px;background:rgba(255,216,176,.1)}
    .shell{
      position:relative;
      width:min(980px,100%);
      border:1px solid var(--line);
      border-radius:34px;
      background:linear-gradient(180deg, rgba(24,38,60,.78), rgba(11,18,30,.9));
      box-shadow:0 30px 90px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter:blur(18px);
      padding:42px 38px 34px;
    }
    .shell::after{
      content:"";position:absolute;left:18px;right:18px;top:18px;height:1px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
      opacity:.8;
    }
    .hero{
      display:flex;align-items:center;gap:18px;margin-bottom:22px;
    }
    .mark{
      width:76px;height:76px;border-radius:24px;
      background:linear-gradient(145deg, rgba(124,196,255,.22), rgba(255,216,176,.12));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 14px 30px rgba(0,0,0,.18);
      display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;
    }
    .mark::before{
      content:"✦";
      font-size:28px;
      color:#ecf5ff;
      text-shadow:0 0 18px rgba(124,196,255,.35);
    }
    .heroText{display:flex;flex-direction:column;gap:8px;min-width:0}
    .eyebrow{
      width:max-content;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.05);color:#d8e7ff;font-size:12px;font-weight:700;letter-spacing:.12em;
    }
    h1{margin:0;font-size:42px;line-height:1.12;font-weight:900;letter-spacing:.01em}
    .sub{margin:0;color:var(--muted);font-size:15px;line-height:1.75}
    .entryBox{
      border:1px solid rgba(255,255,255,.08);
      border-radius:26px;
      background:linear-gradient(180deg, rgba(18,29,47,.62), rgba(12,20,33,.76));
      padding:18px;
      display:flex;flex-direction:column;gap:14px;
    }
    .entryHead{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .entryTitle{font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--soft)}
    .entryHint{font-size:12px;color:#91a4c5}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .btn{
      width:100%;border:1px solid rgba(255,255,255,.08);border-radius:22px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      color:var(--text);padding:22px 18px;text-align:left;cursor:pointer;transition:.22s ease;
      display:flex;align-items:flex-start;gap:14px;min-height:122px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
    }
    .btn:hover{
      transform:translateY(-2px);
      border-color:rgba(124,196,255,.26);
      background:linear-gradient(180deg, rgba(124,196,255,.11), rgba(255,255,255,.04));
      box-shadow:0 18px 28px rgba(0,0,0,.14);
    }
    .icon{
      width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(145deg, rgba(124,196,255,.16), rgba(255,255,255,.05));
      border:1px solid rgba(255,255,255,.08);font-size:18px;flex:0 0 auto;
    }
    .copy{display:flex;flex-direction:column;gap:8px;min-width:0}
    .btn strong{font-size:18px;line-height:1.22}
    .btn span{font-size:13px;line-height:1.6;color:var(--muted)}
    .foot{
      margin-top:16px;color:#91a4c5;font-size:12px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    }
    .foot .left{display:flex;align-items:center;gap:8px}
    .dot{width:8px;height:8px;border-radius:999px;background:linear-gradient(180deg,#9cd2ff,#7cc4ff);box-shadow:0 0 12px rgba(124,196,255,.45)}
    @media (max-width:640px){
      body{padding:18px}
      .shell{padding:24px 18px 18px;border-radius:26px}
      .hero{align-items:flex-start}
      .mark{width:58px;height:58px;border-radius:18px}
      h1{font-size:28px}
      .grid{grid-template-columns:1fr}
      .btn{min-height:92px;border-radius:18px}
      .entryHead{align-items:flex-start;flex-direction:column}
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="hero">
      <div class="mark"></div>
      <div class="heroText">
        <div class="eyebrow">HELLO</div>
        <h1>你好，欢迎回来</h1>
        <p class="sub">直接点下面的入口就可以，页面更柔和一点，打开时也不会显得太硬。</p>
      </div>
    </div>

    <section class="entryBox">
      <div class="entryHead">
        <div class="entryTitle">进入四个页面</div>
        <div class="entryHint">1 / 2 / 3 / 4 也可以直接进入</div>
      </div>
      <div class="grid">
        <button class="btn" type="button" data-target="schedule">
          <div class="icon">◔</div>
          <div class="copy">
            <strong>今日总控台</strong>
            <span>日程、执行、当天推进都从这里进入。</span>
          </div>
        </button>
        <button class="btn" type="button" data-target="customers">
          <div class="icon">◎</div>
          <div class="copy">
            <strong>客户跟进区</strong>
            <span>客户资料、跟进记录、沟通信息都在这里。</span>
          </div>
        </button>
        <button class="btn" type="button" data-target="music">
          <div class="icon">♫</div>
          <div class="copy">
            <strong>音乐系统</strong>
            <span>进入 A1 播放、队列和音乐控制页面。</span>
          </div>
        </button>
        <button class="btn" type="button" data-target="video">
          <div class="icon">▣</div>
          <div class="copy">
            <strong>视频系统</strong>
            <span>进入视频播控、上屏和输出页面。</span>
          </div>
        </button>
      </div>
    </section>

    <div class="foot">
      <div class="left"><span class="dot"></span><span id="appMeta">正在读取程序信息…</span></div>
      <div>信伯礼控 simple studio</div>
    </div>
  </main>

  <script>
    const desktop = window.anningDesktop || {};

    function setMeta(summary){
      const meta = document.getElementById('appMeta');
      if(!meta) return;
      const name = summary?.appName || '桌面程序';
      meta.textContent = name;
    }

    async function boot(){
      try{
        if(desktop.getStartupSummary){
          const summary = await desktop.getStartupSummary();
          if(summary?.ok !== false) setMeta(summary || {});
        } else {
          setMeta({ appName: '桌面程序' });
        }
      }catch(_e){
        setMeta({ appName: '桌面程序' });
      }

      document.querySelectorAll('[data-target]').forEach((btn)=>{
        btn.addEventListener('click', async ()=>{
          const target = btn.getAttribute('data-target') || 'schedule';
          try{
            if(desktop.welcomeAction) await desktop.welcomeAction(target, false);
            else if(desktop.navigateTo) await desktop.navigateTo(target);
          }catch(_e){}
        });
      });

      document.addEventListener('keydown', async (event)=>{
        const keyMap = { '1':'schedule', '2':'customers', '3':'music', '4':'video' };
        const target = keyMap[event.key];
        if(!target) return;
        try{
          if(desktop.welcomeAction) await desktop.welcomeAction(target, false);
          else if(desktop.navigateTo) await desktop.navigateTo(target);
        }catch(_e){}
      });
    }

    boot();
  </script>
</body>
</html>
